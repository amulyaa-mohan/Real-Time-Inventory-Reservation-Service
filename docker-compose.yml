services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inv
      POSTGRES_PASSWORD: inv
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inv -d inventory"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://inv:inv@postgres:5432/inventory
      REDIS_URL: redis://redis:6379/0
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-120}
      REAPER_INTERVAL_SECONDS: 10
      REAPER_BATCH_SIZE: 500
      IDEMPOTENCY_TTL_SECONDS: 86400
      MAX_RESERVE_RETRIES: 5
      DB_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
